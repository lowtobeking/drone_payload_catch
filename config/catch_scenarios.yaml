# ============================================================================
# catch_scenarios.yaml — 空投—空中捕获任务的【单一真值源】
# ----------------------------------------------------------------------------
# 谁读它:
#   tools/offline_run.py         → 离线(纯 Python)跑通规划/会合/捕获并出报告
#   launch/catch_launch.py 后续  → 把几何/参数注入 ROS 节点
#   tools/gen_spawn.py 后续      → 生成 A/B 两架 PX4 的出生 POSES
#
# 坐标: 一律世界系 NED = [North, East, Down]（z 向下为正）。
#       高度(离地) = -z；A 在 z=-3.0 即离地 3.0 m。
#
# 任务: A 携载飞行，在算法求出的 (释放时刻 t_r, 捕获时刻 t_c) 抛投；
#       B 实时机动到空间会合点，位置到达 + 相对速度尽量小即判捕获。
#
# A 的运动: 恒速直线  p_A(t) = a_init + a_vel·t。a_vel 全零即悬停释放。
# ============================================================================

# ── 公共参数 ────────────────────────────────────────────────────────────────
defaults:
  g:                9.81      # 重力加速度 m/s²
  control_hz:      50.0      # 规划/控制频率
  duration_s:      20.0      # 单次仿真时长上限

  payload:                    # 重物（第一版忽略阻力，风只作鲁棒性输入）
    mass:           0.30      # kg
    drag_mode:     none      # none | linear | quadratic
    drag_k:        0.0        # linear: 1/s；quadratic: m⁻¹（含义随 drag_mode）

  drone_b:                    # B 的动力学限幅（仿真宽松档，便于先跑通）
    max_speed:      5.0       # m/s（三维速度范数上限；须 ≥ 会合点的载荷速度）
    max_accel:      6.0       # m/s²（加速度范数上限）

  capture:                    # 捕获判据：位置进 r_c，且相对速度 < v_c
    radius:         0.30      # m，r_c
    rel_speed:      1.50      # m/s，v_c
    funnel:                   # M6 垂直堆叠：刚性漏斗的物理捕获判据
      mouth_radius: 0.20      # m，漏斗口半径（载荷须落在口内）
      depth:        0.30      # m，漏斗深度（决定能兜住多快的下落）
      restitution:  0.60      # 恢复系数 e；v_retain = sqrt(2·g·depth)/e
      mount_height: 0.10      # m，漏斗口平面在 B 机体中心之上的高度
      object_radius: 0.05     # m，载荷等效半径（口内有效半径 = mouth_radius − object_radius）

  stack:                      # M6 垂直堆叠投放（A 正上方释放、B 温和下潜软捕获）
    a_dive:         3.0       # m/s²，B 接触前的下潜加速度（温和=给刹车留余量）
    a_brake:        6.0       # m/s²，B 接触后的刹车加速度

  planner:                    # 协调求解器：搜 (t_r, τ_c)
    t_r_min:        0.0       # s，释放时刻搜索下界
    t_r_max:        8.0       # s，释放时刻搜索上界
    t_r_step:       0.05      # s
    tau_min:        0.05      # s，下落时长搜索下界
    tau_max:        1.20      # s，下落时长搜索上界
    tau_step:       0.01      # s
    catch_alt_min:  0.80      # m，捕获高度下界（离地）
    catch_alt_max:  2.00      # m，捕获高度上界
    w_time:         0.20      # 代价权重：释放越晚越贵（防无限拖延）
    w_accel:        1.00      # 代价权重：B 峰值加速度 / a_max
    w_vel:          5.00      # 代价权重：终端速度失配（软终端速度时用）
    w_overshoot:    0.00      # 代价权重：B 轨迹超出 [起始,会合] 高度包络的过冲(0=旧行为)
    reference_mode: cubic     # B 参考轨迹：cubic(min-energy 三次) | staged(分段俯冲)
    reference_a_frac: 1.0     # staged 时俯冲加速度占 a_max 的比例(留反馈余量, 如 0.8)
    ground_margin:  0.30      # m，B 轨迹 / 载荷离地最小余量

  wind: [0.0, 0.0, 0.0]       # [N,E,D] m/s，标称无风

  estimator:                  # 载荷状态估计
    mode:          none       # none=用真值(理想) | naive=有限差分+外推 | kf=卡尔曼滤波
    q_accel:       2.0        # KF 过程噪声(未建模加速度 std, m/s²)
    meas_sigma:    0.05       # KF 测量噪声先验 (m)

  measurement:                # 载荷状态测量管线（单一真值源；MC 可覆盖）
    pos_sigma:     0.0        # m，测量位置噪声
    latency_s:     0.0        # s，测量延迟
    dropout:       0.0        # 丢包率 [0,1]

  mpc:                        # B 的终端 MPC（acados）权重/视界
    N:            20          # 视界步数（N·dt 秒）
    q_pos:        40.0
    q_vel:        8.0
    r_a:          0.5
    q_pos_e:      400.0
    q_vel_e:      80.0

# ── 布局：A 初始位置+速度、B 待命点（均世界系 NED）─────────────────────────
layouts:
  hover_catch:                          # M1 基准：A 悬停
    a_init:    [0.0, 0.0, -2.5]
    a_vel:     [0.0, 0.0, 0.0]
    b_standby: [1.2, 0.0, -3.5]

  line_catch:                           # M2：A 沿 +N 恒速飞行
    a_init:    [-4.0, 0.0, -3.0]
    a_vel:     [1.0, 0.0, 0.0]          # 1.0 m/s 向北
    b_standby: [2.0, 0.0, -2.5]

  high_hover_catch:                     # M3：更高的释放点，下落时间长 → 模型失配显现
    a_init:    [0.0, 0.0, -5.0]
    a_vel:     [0.0, 0.0, 0.0]
    b_standby: [1.5, 0.0, -4.0]

  stack_drop:                           # M6：A 严格在 B 正上方，垂直投放
    a_init:    [0.0, 0.0, -4.5]         # A 悬停 4.5m
    a_vel:     [0.0, 0.0, 0.0]
    b_standby: [0.0, 0.0, -3.5]         # B 待命 3.5m，与 A 垂直间距 gap=1.0m

# ── 工况 ───────────────────────────────────────────────────────────────────
scenarios:
  # ── M1 悬停释放 ──
  M1_basic:
    layout: hover_catch
    description: 标称无风；验证规划—会合—捕获闭环

  M1_wind:
    layout: hover_catch
    wind: [0.5, 0.3, 0.0]               # 常值风（drag=none 时对载荷无效，占位）
    description: 常值风扰动下的捕获

  # ── M2 带速抛投：A 以 0.5 / 1.0 / 2.0 m/s 平飞 ──
  M2_line_v05:
    layout: line_catch
    a_vel: [0.5, 0.0, 0.0]
    description: A 0.5 m/s 平飞抛投

  M2_line_v10:
    layout: line_catch
    a_vel: [1.0, 0.0, 0.0]
    description: A 1.0 m/s 平飞抛投（基准）

  M2_line_v20:
    layout: line_catch
    a_vel: [2.0, 0.0, 0.0]
    description: A 2.0 m/s 平飞抛投（速度应力）

  # 横向抛投：A 沿 +E 飞，载荷带横向速度
  M2_crosswind:
    layout: line_catch
    a_init: [-3.0, -1.0, -3.0]
    a_vel:  [1.0, 0.6, 0.0]
    description: A 斜向平飞（N+E 分量）抛投

  # ── M3 闭环重规划：高抛（下落时间长 → B 有更多时间纠正释放误差）──
  M3_high:
    layout: high_hover_catch
    drone_b: {max_speed: 9.0, max_accel: 10.0}
    planner: {tau_max: 1.2, catch_alt_min: 1.2, catch_alt_max: 2.5}
    description: 高抛（下落~0.8s）；释放误差下闭环重规划的时间裕度更大

  # ── M3 闭环重规划：模型失配（规划器按无阻力预测，实际有风+阻力）──
  M3_wind_drag:
    layout: high_hover_catch
    closed_loop: true
    payload: {drag_mode: linear, drag_k: 2.0}
    wind: [2.0, 1.0, 0.0]
    drone_b: {max_speed: 9.0, max_accel: 10.0}
    planner: {tau_max: 1.4, catch_alt_min: 1.2, catch_alt_max: 2.5}
    description: 高抛 + 风+阻力；开环按无阻力预测会偏，闭环重规划可纠正

  # ── M3+ MPC 对照工况：B 用 acados 终端 MPC ──
  M3p_line_mpc:
    layout: line_catch
    controller: mpc
    description: M2_line_v10 但 B 用终端 MPC

  M3p_high_mpc:
    layout: high_hover_catch
    controller: mpc
    drone_b: {max_speed: 9.0, max_accel: 10.0}
    planner: {tau_max: 1.2, catch_alt_min: 1.2, catch_alt_max: 2.5}
    description: M3_high 但 B 用终端 MPC

  # ── M6 垂直堆叠投放：A 正上方释放 + B 温和下潜软捕获（刚性漏斗）──
  M6_stack_drop:
    layout: stack_drop
    mode: stack_drop
    stack: {a_dive: 3.0, a_brake: 6.0}
    description: A 严格在 B 正上方 1m 释放；B 温和下潜(a=3)，刚性漏斗口半径0.2m兜住

  # ── M4 鲁棒性：测量噪声+延迟+丢包，估计器对照 ──
  M4_line_naive:
    layout: line_catch
    closed_loop: true
    estimator: {mode: naive}
    measurement: {pos_sigma: 0.05, latency_s: 0.10, dropout: 0.20}
    description: 含噪/延迟/丢包测量，朴素估计

  M4_line_kf:
    layout: line_catch
    closed_loop: true
    estimator: {mode: kf}
    measurement: {pos_sigma: 0.05, latency_s: 0.10, dropout: 0.20}
    description: 含噪/延迟/丢包测量，卡尔曼滤波

  M4_high_kf:
    layout: high_hover_catch
    closed_loop: true
    estimator: {mode: kf}
    drone_b: {max_speed: 9.0, max_accel: 10.0}
    planner: {tau_max: 1.2, catch_alt_min: 1.2, catch_alt_max: 2.5}
    measurement: {pos_sigma: 0.05, latency_s: 0.10, dropout: 0.20}
    description: 高抛 + 含噪/延迟/丢包测量 + KF

# ── 判定阈值（离线报告用；后续 verdict 用）────────────────────────────────
thresholds:
  capture_success: true      # 是否捕获成功
  miss_dist:       0.30      # m，捕获时刻位置偏差上限
  rel_speed:       1.50      # m/s，捕获时刻相对速度上限
  peak_accel_ratio: 1.00     # 峰值加速度 / a_max 上限
